<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Cup 26 · Auth Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Banner global para errores de RED/CORS (distinto de errores de validación de un input) -->
  <div id="network-banner" class="network-banner hidden" role="alert">
    <span id="network-banner-text"></span>
  </div>

  <main class="app-shell">

    <!-- ============ VISTA 1: REGISTRO ============ -->
    <section id="view-register" class="card">
      <header class="card-header">
        <span class="eyebrow">Nuevo jugador</span>
        <h1>Crear cuenta</h1>
      </header>

      <form id="form-register" novalidate>
        <div class="field">
          <label for="reg-name">Nombre</label>
          <input type="text" id="reg-name" name="name" autocomplete="name" />
          <span class="error-message" id="reg-name-error"></span>
        </div>

        <div class="field">
          <label for="reg-email">Correo</label>
          <input type="email" id="reg-email" name="email" autocomplete="email" />
          <span class="error-message" id="reg-email-error"></span>
        </div>

        <div class="field">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" name="password" autocomplete="new-password" />
          <span class="hint">Mínimo 6 caracteres, 1 número y 1 mayúscula.</span>
          <span class="error-message" id="reg-password-error"></span>
        </div>

        <button type="submit" class="btn-primary" id="reg-submit">
          <span class="btn-label">Registrarme</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>

        <span class="error-message form-level" id="reg-form-error"></span>
      </form>

      <p class="switch-view">
        ¿Ya tienes cuenta?
        <button type="button" class="link-btn" id="go-to-login">Inicia sesión</button>
      </p>
    </section>

    <!-- ============ VISTA 2: LOGIN ============ -->
    <section id="view-login" class="card hidden">
      <header class="card-header">
        <span class="eyebrow">Bienvenido de vuelta</span>
        <h1>Iniciar sesión</h1>
      </header>

      <form id="form-login" novalidate>
        <div class="field">
          <label for="log-email">Correo</label>
          <input type="email" id="log-email" name="email" autocomplete="email" />
          <span class="error-message" id="log-email-error"></span>
        </div>

        <div class="field">
          <label for="log-password">Contraseña</label>
          <input type="password" id="log-password" name="password" autocomplete="current-password" />
          <span class="error-message" id="log-password-error"></span>
        </div>

        <button type="submit" class="btn-primary" id="log-submit">
          <span class="btn-label">Entrar</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>

        <span class="error-message form-level" id="log-form-error"></span>
      </form>

      <p class="switch-view">
        ¿No tienes cuenta?
        <button type="button" class="link-btn" id="go-to-register">Regístrate</button>
      </p>
    </section>

    <!-- ============ VISTA 3: PROTEGIDA ============ -->
    <section id="view-protected" class="card wide hidden">
      <header class="card-header row">
        <div>
          <span class="eyebrow">Sesión activa</span>
          <h1>Selección de equipos</h1>
        </div>
        <button type="button" class="btn-ghost" id="logout-btn">Cerrar sesión</button>
      </header>

      <div id="teams-status" class="teams-status"></div>
      <ul id="teams-list" class="teams-list"></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
