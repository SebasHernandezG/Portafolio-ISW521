<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini-sistema de Autenticación · World Cup 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-shell">

    <header class="app-header">
      <span class="app-header__badge">ISW-521</span>
      <h1>Mini-sistema de Autenticación</h1>
      <p class="app-header__subtitle">Registro, login y consumo de un recurso protegido con JWT</p>
    </header>

    <!-- ======================================================= -->
    <!-- VISTA 1: REGISTRO                                        -->
    <!-- ======================================================= -->
    <section id="view-register" class="view">
      <div class="card">
        <h2>Crear una cuenta</h2>

        <!-- Contenedor genérico para errores que no pertenecen a un campo puntual -->
        <div id="register-form-error" class="form-error hidden" role="alert"></div>

        <form id="register-form" novalidate>

          <div class="field">
            <label for="register-name">Nombre completo</label>
            <input type="text" id="register-name" name="name" autocomplete="name" placeholder="John Doe">
            <span class="error-message" id="register-name-error"></span>
          </div>

          <div class="field">
            <label for="register-email">Correo electrónico</label>
            <input type="email" id="register-email" name="email" autocomplete="email" placeholder="john@example.com">
            <span class="error-message" id="register-email-error"></span>
          </div>

          <div class="field">
            <label for="register-password">Contraseña</label>
            <input type="password" id="register-password" name="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
            <span class="error-message" id="register-password-error"></span>
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn--primary">
            <span class="btn__label">Registrarme</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>

        <p class="switch-view">
          ¿Ya tienes cuenta?
          <button type="button" id="go-to-login" class="link-btn">Inicia sesión</button>
        </p>
      </div>
    </section>

    <!-- ======================================================= -->
    <!-- VISTA 2: LOGIN                                           -->
    <!-- ======================================================= -->
    <section id="view-login" class="view hidden">
      <div class="card">
        <h2>Iniciar sesión</h2>

        <div id="login-form-error" class="form-error hidden" role="alert"></div>

        <form id="login-form" novalidate>

          <div class="field">
            <label for="login-email">Correo electrónico</label>
            <input type="email" id="login-email" name="email" autocomplete="email" placeholder="john@example.com">
            <span class="error-message" id="login-email-error"></span>
          </div>

          <div class="field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Tu contraseña">
            <span class="error-message" id="login-password-error"></span>
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn--primary">
            <span class="btn__label">Ingresar</span>
            <span class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>

        <p class="switch-view">
          ¿No tienes cuenta?
          <button type="button" id="go-to-register" class="link-btn">Regístrate</button>
        </p>
      </div>
    </section>

    <!-- ======================================================= -->
    <!-- VISTA 3: PROTEGIDA                                       -->
    <!-- ======================================================= -->
    <section id="view-protected" class="view hidden">
      <div class="card card--wide">
        <div class="protected-header">
          <div>
            <h2>Equipos del Mundial 2026</h2>
            <p id="welcome-message" class="protected-header__welcome"></p>
          </div>
          <button type="button" id="logout-btn" class="btn btn--ghost">Cerrar sesión</button>
        </div>

        <div id="protected-status" class="protected-status"></div>

        <div id="teams-grid" class="teams-grid"></div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
